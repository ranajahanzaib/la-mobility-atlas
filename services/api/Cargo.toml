[package]
name = "la_mobility_api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "la_mobility_server"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum = { version = "0.7.9", default-features = false, features = ["json", "query", "matched-path"] }
tower-http = { version = "0.6.11", default-features = false, features = ["cors"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.7.9", features = ["tokio", "http1"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "trace", "fs"] }
